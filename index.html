<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中性原子多程序 Stage 查看器</title>
<style>
:root{
  --bg:#f4f5f8;--panel:#fff;--border:#dde1ea;--text:#171a21;--dim:#5b6274;--faint:#8b92a3;
  --storage:#2f8fd9;--entangling:#8b5fe0;--readout:#c9971f;
  --q1:#d6337f;--cz:#12977b;--ro:#b0781a;--mv:#d9731c;--aod:#c23b32;
  --site:#b9bfcc;--accent:#0e7fa8;--ok:#138a5c;--bad:#c23b32;--on-accent:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e13;--panel:#14171e;--border:#282c38;--text:#e7e9f0;--dim:#a0a6b8;--faint:#6d7488;
  --storage:#5fb1ff;--entangling:#b090ff;--readout:#f0c34d;
  --q1:#ff6fb0;--cz:#3ddcb4;--ro:#f0c34d;--mv:#ffa24d;--aod:#ff6b60;
  --site:#434a5c;--accent:#5fd0ff;--ok:#3ddc9a;--bad:#ff6b60;--on-accent:#0c0e13;}}
:root[data-theme="dark"]{
  --bg:#0c0e13;--panel:#14171e;--border:#282c38;--text:#e7e9f0;--dim:#a0a6b8;--faint:#6d7488;
  --storage:#5fb1ff;--entangling:#b090ff;--readout:#f0c34d;
  --q1:#ff6fb0;--cz:#3ddcb4;--ro:#f0c34d;--mv:#ffa24d;--aod:#ff6b60;
  --site:#434a5c;--accent:#5fd0ff;--ok:#3ddc9a;--bad:#ff6b60;--on-accent:#0c0e13;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;min-width:0}
.card + .card{margin-top:14px}
h2{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
h2 small{color:var(--dim);font-weight:400;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.row > label.k{color:var(--dim);font-size:13px;min-width:44px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--border);background:transparent;color:var(--text);padding:5px 9px;cursor:pointer;font:inherit;font-size:13px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.stages{display:flex;flex-wrap:wrap;gap:3px}
.stages button{position:relative;min-width:32px;height:30px;padding:0 6px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer;font:inherit;font-size:12px;font-variant-numeric:tabular-nums}
.stages button::after{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:var(--k,transparent)}
.stages button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stages button.past{color:var(--faint)}
button.b{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
button.b.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
label{color:var(--dim);font-size:13px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.stat{font-size:13px;color:var(--dim)} .stat b{color:var(--text)}
.canvas{position:relative;border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:70vh;background:var(--panel)}
#cv{display:block}
#cv text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;pointer-events:none}
.zoom{margin-left:auto;display:inline-flex;gap:4px;align-items:center}
.zoom output{width:44px;text-align:center;font-size:12px;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--dim);margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.circ{cursor:pointer;padding:1px 6px;border-radius:6px}
.circ.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
.ops{display:grid;gap:6px}
.op{display:grid;grid-template-columns:36px 1fr;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.op:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.op.on{box-shadow:inset 0 0 0 2px var(--accent)}
.op .id{font-weight:700;font-size:13px}
.op .kind{font-size:12px;font-weight:600;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:11px;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--dim) 12%,transparent);font-variant-numeric:tabular-nums}
.chip.q1{background:color-mix(in srgb,var(--q1) 16%,transparent);color:var(--q1)}
.chip.cz{background:color-mix(in srgb,var(--cz) 16%,transparent);color:var(--cz)}
.chip.mv{background:color-mix(in srgb,var(--mv) 16%,transparent);color:var(--mv)}
.idle{color:var(--faint);font-size:12px}
.why{color:var(--dim);font-size:11px;margin-top:3px}
.tw{overflow:auto;max-height:340px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--panel)}
#per tr[data-stage]{cursor:pointer}
#per tr[data-stage]:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
tr.cur td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.kd{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.metrics{margin:0;font-size:12px;line-height:1.6;color:var(--dim)}
.metrics dt{display:inline;color:var(--text);font-weight:600}
.metrics dt::after{content:"："}
.metrics dd{display:inline;margin:0}
.metrics dd::after{content:"";display:block;height:6px}
.formula{font-family:Georgia,"Times New Roman",serif;color:var(--text)}
.formula sup,.formula sub{font-size:.72em;line-height:0}
.gantt{display:block;width:100%;height:auto;cursor:pointer}
.note{font-size:12px;color:var(--dim);margin-top:6px}
.kbd kbd{font:inherit;font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.dimmed{opacity:.15}
</style>
</head>
<body>
<div class="wrap">
<h1>中性原子多程序并行执行</h1>
<div class="sub" id="subtitle"></div>
<div class="grid">
  <div>
    <div class="card">
      <div class="row">
        <label class="k">架构</label>
        <div class="seg" id="arch"></div>
        <button class="b" id="initial" type="button" aria-pressed="false">Initial mapping</button>
        <span class="zoom">
          <button class="b" id="zout" type="button" aria-label="缩小">−</button><output id="zlab">100%</output>
          <button class="b" id="zin" type="button" aria-label="放大">+</button>
          <button class="b" id="zfit" type="button">适配</button>
          <button class="b" id="theme" type="button" title="切换明暗">◐</button>
        </span>
      </div>
      <div class="row"><label class="k">Stage</label><div class="stages" id="st"></div></div>
      <div class="row">
        <button class="b" id="play" type="button">▶ 播放</button>
        <button class="b" id="prev" type="button" title="上一步（←）">◀</button>
        <button class="b" id="next" type="button" title="下一步（→）">▶|</button>
        <button class="b" id="speed" type="button" title="播放速度">1×</button>
        <input type="range" id="bt" min="0" max="1" step="1" value="0" aria-label="本 Stage 内：门操作 → AOD 移动批次">
        <span class="stat num" id="btlab"></span>
      </div>
      <div class="canvas" id="vp"><svg id="cv" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="原子阵列"></svg></div>
      <div class="legend" id="legend"></div>
      <div class="legend">
        <span><span class="sw" style="background:var(--storage)"></span>存储区 SZ</span>
        <span><span class="sw" style="background:var(--entangling)"></span>纠缠区 EZ</span>
        <span><span class="sw" style="background:var(--readout)"></span>读出区 RZ</span>
        <span><span class="dot" style="background:var(--q1)"></span>单比特门</span>
        <span><span class="dot" style="background:var(--cz)"></span>CZ</span>
        <span>细虚线 = 本 Stage 全部移动路径；粗线 = 当前批次；红线 = AOD 行/列</span>
      </div>
      <div class="row" style="margin-top:8px">
        <label><input type="checkbox" id="allp" checked> 显示全部路径</label>
        <label><input type="checkbox" id="aod" checked> 显示 AOD 行列线</label>
        <label><input type="checkbox" id="skip"> 播放时跳过移动</label>
        <span class="kbd stat" style="margin-left:auto"><kbd>空格</kbd> 播放 · <kbd>←</kbd><kbd>→</kbd> 单步 · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> 跳 Stage · <kbd>R</kbd> 重放</span>
      </div>
      <div class="stat" id="live"></div>
    </div>
    <div class="card">
      <h2>每电路时间线 <small>横轴为真实时间（含搬运）· 点击跳转</small></h2>
      <svg class="gantt" id="gantt" role="img" aria-label="每电路阶段甘特图"></svg>
      <div class="legend">
        <span><span class="sw" style="background:#FF27E6"></span>计算</span><span><span class="sw" style="background:#397aa0"></span>搬运中</span>
        <span><span class="sw" style="background:#c9d3ce"></span>等待</span><span><span class="sw" style="background:#C72BFF"></span>读出</span>
      </div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2><span id="opsTitle">Stage 0</span><small id="opsSub"></small></h2>
      <div class="ops" id="ops"></div>
      <div class="note num" id="opsMeta"></div>
    </div>
    <div class="card">
      <h2>逐 Stage <small>点击行跳转</small></h2>
      <div class="tw" id="perWrap"><table id="per"></table></div>
    </div>
    <div class="card">
      <h2>Fidelity</h2>
      <dl class="metrics" id="metrics"></dl>
    </div>
    <div class="card">
      <h2>架构对比 <small>*Original 为论文参数下的 UI 重建</small></h2>
      <table id="cmp"></table>
    </div>
  </div>
</div>
</div>

<script src="timeline_metrics.js"></script>
<script>
  const ARCH = new URLSearchParams(location.search).get('architecture') === 'multiq-original' ? 'multiq-original' : 'five';
  for (const src of { five: ['stage_timing.js', 'stage_scene.js'], 'multiq-original': ['original_multiq_timing.js', 'original_multiq_scene.js'] }[ARCH])
    document.write(`<script src="${src}"><\/script>`);
</script>
<script>
(() => {
'use strict';
const T = window.STAGE_TIMING, S = window.STAGE_SCENE;
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
if (!T || !S) { $('subtitle').innerHTML = '<b style="color:var(--bad)">缺少数据：请先运行 python3 AtomCloud/animation/build_scene_data.py</b>'; return; }

// ------------------------------------------------------------------ model
// steps = [stage 0, move 0.1..0.n, stage 1, ...] — same order as T.viewer_timeline.
const steps = T.viewer_timeline.map((it) => ({ kind: it.kind, stage: it.stage, sub: it.substage ?? -1, count: it.substage_count ?? 0 }));
const stageStep = []; steps.forEach((s, i) => { if (s.kind === 'stage') stageStep[s.stage] = i; });
const last = steps.length - 1;
const realCum = T.real_cumulative_ns || [], realDur = T.real_step_durations_ns || [], realTotal = T.real_total_ns || 0;
const circuits = S.circuits;
const COL = Object.fromEntries(circuits.map((c) => [c, S.palette[c].label]));
const kindOf = (st) => { const o = S.ops[st] || []; return o.some((x) => x.kind === 'CZ') ? 'CZ' : o.some((x) => x.kind === '1Q') ? '1Q' : st >= S.gate_stage_count ? 'RO' : 'idle'; };
const KVAR = { '1Q': '--q1', CZ: '--cz', RO: '--ro', idle: '--faint' };
const KNAME = { '1Q': '单比特门', CZ: 'Rydberg CZ', RO: '读出', idle: '空闲' };
const fmt = (ns) => ns >= 1e6 ? `${(ns / 1e6).toFixed(3)} ms` : ns >= 1e3 ? `${(ns / 1e3).toFixed(1)} μs` : `${ns.toFixed(1)} ns`;
const REASON = { row: '行汇合', diagonal: '列汇合', column: '光束交点', 'order-swap': '顺序交换', diverge: '行/列分裂' };

let cur = 0, tau = 1, playing = false, raf = 0, initial = false, focus = null;
const speeds = [.5, .75, 1, 1.5, 2, 3]; let sp = 2;

$('subtitle').textContent = `${ARCH === 'five' ? '五分区' : 'Original MultiQ（重建）'} · 批次 ${T.batch_index ?? 0} · ${circuits.length} 个电路 · ${S.gate_stage_count} 个门 Stage · 共 ${steps.filter((s) => s.kind === 'move_stage').length} 个 AOD 移动批次 · 总时长 ${fmt(realTotal)}`;

// ------------------------------------------------------------ static svg
const svg = $('cv');
svg.setAttribute('viewBox', `0 0 ${S.width} ${S.height}`);
mk('defs', {}, svg).innerHTML = '<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>';
const ZVAR = { SZ: '--storage', EZ: '--entangling', RZ: '--readout' };
const zoneRect = {};
for (const z of S.zones) {
  zoneRect[z.name] = mk('rect', { x: z.x, y: z.y, width: z.w, height: z.h, rx: 14, style: `fill:var(${ZVAR[z.kind]});fill-opacity:.07;stroke:var(${ZVAR[z.kind]});stroke-width:3` }, svg);
  mk('text', { x: z.x + 4, y: z.y - 12, 'font-size': 24, 'font-weight': 600, style: `fill:var(${ZVAR[z.kind]})` }, svg).textContent = z.name;
}
const siteG = mk('g', {}, svg);
for (const [x, y] of S.sites) mk('circle', { cx: x, cy: y, r: 9, style: 'fill:none;stroke:var(--site);stroke-width:2.5' }, siteG);
const planG = mk('g', {}, svg), fxG = mk('g', {}, svg), pathG = mk('g', {}, svg), aodG = mk('g', {}, svg), atomG = mk('g', {}, svg);

const atoms = {};
for (const c of circuits) atoms[c] = S.states[0][c].map(([x, y], q) => {
  const g = mk('g', { transform: `translate(${x} ${y})` }, atomG);
  const ring = mk('circle', { r: 21, fill: 'none', 'stroke-width': 4, style: 'stroke:var(--text)', opacity: 0 }, g);
  mk('circle', { r: 16, fill: COL[c] }, g);
  mk('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 15, 'font-weight': 700, fill: '#fff' }, g).textContent = q;
  mk('title', {}, g).textContent = `${c} · q${q}`;
  return { g, ring };
});
const place = (c, q, x, y, moving = false) => {
  const a = atoms[c][q];
  a.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  a.ring.setAttribute('opacity', moving ? .9 : 0);
};

// planned EZ pairs (initial-mapping view)
const planned = {};
for (const ops of S.ops) for (const o of ops) if (o.kind === 'CZ') { planned[o.circuit] ||= new Map(); for (const p of o.centres) planned[o.circuit].set(p.join(), p); }

// --------------------------------------------------------------- drawing
const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const PICK = .12, DROP = .12;

function highlightZones(st) {
  const k = kindOf(st), on = new Set();
  if (k === 'CZ') S.zones.filter((z) => z.kind === 'EZ').forEach((z) => on.add(z.name));
  if (k === '1Q') S.zones.filter((z) => z.kind === 'SZ').forEach((z) => on.add(z.name));
  if ((S.measuring[st] || []).length) S.zones.filter((z) => z.kind === 'RZ').forEach((z) => on.add(z.name));
  for (const z of S.zones) zoneRect[z.name].style.fillOpacity = on.has(z.name) ? .16 : .06;
}
function gateFx(st) {
  fxG.replaceChildren();
  const glow = (x, y, v) => { mk('circle', { cx: x, cy: y, r: 30, style: `fill:var(${v})`, opacity: .45, filter: 'url(#blur)' }, fxG); mk('circle', { cx: x, cy: y, r: 24, style: `fill:none;stroke:var(${v});stroke-width:4` }, fxG); };
  for (const o of S.ops[st] || []) {
    if (focus && o.circuit !== focus) continue;
    if (o.kind === '1Q') for (const q of o.qubits) glow(...S.states[st][o.circuit][q], '--q1');
    else for (const [x, y] of o.centres) {
      mk('rect', { x: x - 46, y: y - 30, width: 92, height: 60, rx: 30, style: 'fill:var(--cz)', opacity: .4, filter: 'url(#blur)' }, fxG);
      mk('rect', { x: x - 42, y: y - 27, width: 84, height: 54, rx: 27, style: 'fill:none;stroke:var(--cz);stroke-width:4' }, fxG);
    }
  }
  for (const c of S.measuring[st] || []) if (!focus || c === focus) for (const [x, y] of S.states[st][c]) glow(x, y, '--ro');
}

function draw() {
  pathG.replaceChildren(); aodG.replaceChildren(); planG.replaceChildren();
  if (initial) {
    fxG.replaceChildren();
    for (const c of circuits) S.states[0][c].forEach(([x, y], q) => place(c, q, x, y));
    for (const c of circuits) for (const [x, y] of planned[c]?.values() || [])
      mk('rect', { x: x - 38, y: y - 26, width: 76, height: 52, rx: 14, fill: COL[c], opacity: .22 }, planG);
    for (const z of S.zones) zoneRect[z.name].style.fillOpacity = .06;
    return;
  }
  const s = steps[cur];
  if (s.kind === 'stage') {
    for (const c of circuits) S.states[s.stage][c].forEach(([x, y], q) => place(c, q, x, y));
    highlightZones(s.stage); gateFx(s.stage);
    return;
  }
  fxG.replaceChildren();
  for (const z of S.zones) zoneRect[z.name].style.fillOpacity = .06;
  const src = S.states[s.stage], dst = S.states[s.stage + 1], layers = S.moves[s.stage];
  const layerOf = new Map(); layers.forEach((L, k) => L.forEach(([c, q]) => layerOf.set(`${c}:${q}`, k)));
  const travel = ease(Math.min(1, Math.max(0, (tau - PICK) / (1 - PICK - DROP))));
  const lift = tau < PICK ? tau / PICK : tau > 1 - DROP ? (1 - tau) / DROP : 1;
  const live = [];
  for (const c of circuits) src[c].forEach(([x0, y0], q) => {
    const k = layerOf.get(`${c}:${q}`);
    const [x1, y1] = dst[c][q];
    if (k === undefined || k > s.sub) return place(c, q, x0, y0);
    if (k < s.sub) return place(c, q, x1, y1);
    const x = x0 + (x1 - x0) * travel, y = y0 + (y1 - y0) * travel;
    place(c, q, x, y, true); live.push({ c, x0, y0, x1, y1, x, y });
  });
  // all paths of this transition (faint), current batch (bold)
  if ($('allp').checked) for (const c of circuits) src[c].forEach(([x0, y0], q) => {
    const k = layerOf.get(`${c}:${q}`); if (k === undefined || k === s.sub) return;
    if (focus && c !== focus) return;
    mk('line', { x1: x0, y1: y0, x2: dst[c][q][0], y2: dst[c][q][1], stroke: COL[c], 'stroke-width': 3, 'stroke-dasharray': '10 8', opacity: k < s.sub ? .18 : .35 }, pathG);
  });
  for (const m of live) {
    if (focus && m.c !== focus) continue;
    mk('line', { x1: m.x0, y1: m.y0, x2: m.x1, y2: m.y1, stroke: COL[m.c], 'stroke-width': 14, 'stroke-linecap': 'round', opacity: .22 }, pathG);
    mk('circle', { cx: m.x1, cy: m.y1, r: 22, fill: 'none', stroke: COL[m.c], 'stroke-width': 3, 'stroke-dasharray': '6 5', opacity: .8 }, pathG);
  }
  if ($('aod').checked && live.length) {
    const pad = 80, xs = live.flatMap((m) => [m.x0, m.x1]), ys = live.flatMap((m) => [m.y0, m.y1]);
    const [L, R, U, D] = [Math.min(...xs) - pad, Math.max(...xs) + pad, Math.min(...ys) - pad, Math.max(...ys) + pad];
    const op = (.2 + .7 * lift).toFixed(2);
    for (const y of new Set(live.map((m) => Math.round(m.y)))) mk('line', { x1: L, y1: y, x2: R, y2: y, style: 'stroke:var(--aod)', 'stroke-width': 2.5, opacity: op }, aodG);
    for (const x of new Set(live.map((m) => Math.round(m.x)))) mk('line', { x1: x, y1: U, x2: x, y2: D, style: 'stroke:var(--aod)', 'stroke-width': 2.5, opacity: op }, aodG);
  }
}

// ------------------------------------------------------------- panels
const chip = (t, c = '') => { const e = document.createElement('span'); e.className = `chip ${c}`; e.textContent = t; return e; };
function opsPanel() {
  const s = steps[cur], box = $('ops'), rows = [];
  if (s.kind === 'stage') {
    const k = kindOf(s.stage);
    $('opsTitle').textContent = `Stage ${s.stage}`; $('opsSub').textContent = KNAME[k];
    for (const c of circuits) {
      const o = (S.ops[s.stage] || []).find((x) => x.circuit === c), b = document.createElement('div');
      if (o?.kind === '1Q') { const h = document.createElement('div'); h.className = 'kind'; h.style.color = 'var(--q1)'; h.textContent = `U3 × ${o.qubits.length}`; const ch = document.createElement('div'); ch.className = 'chips'; ch.append(...o.qubits.map((q) => chip(`q${q}`, 'q1'))); b.append(h, ch); }
      else if (o?.kind === 'CZ') { const h = document.createElement('div'); h.className = 'kind'; h.style.color = 'var(--cz)'; h.textContent = `CZ × ${o.pairs.length}`; const ch = document.createElement('div'); ch.className = 'chips'; ch.append(...o.pairs.map(([a, bb]) => chip(`q${a}–q${bb}`, 'cz'))); b.append(h, ch); }
      else if ((S.measuring[s.stage] || []).includes(c)) { const h = document.createElement('div'); h.className = 'kind'; h.style.color = 'var(--ro)'; h.textContent = `在 ${T.circuit_readout_zone?.[c] ?? 'RZ'} 测量`; b.append(h); }
      else { const h = document.createElement('div'); h.className = 'idle'; h.textContent = '空闲（等待其他电路）'; b.append(h); }
      rows.push([c, b]);
    }
  } else {
    $('opsTitle').textContent = `移动 ${s.stage} → ${s.stage + 1}`; $('opsSub').textContent = `AOD 批次 ${s.sub + 1}/${s.count}`;
    const layer = S.moves[s.stage][s.sub];
    for (const c of circuits) {
      const mine = layer.filter(([cc]) => cc === c), b = document.createElement('div');
      if (!mine.length) { const h = document.createElement('div'); h.className = 'idle'; h.textContent = '本批次不移动'; b.append(h); }
      else {
        const h = document.createElement('div'); h.className = 'kind'; h.style.color = 'var(--mv)'; h.textContent = `移动 ${mine.length} 个原子`;
        const ch = document.createElement('div'); ch.className = 'chips'; ch.append(...mine.map(([, q]) => chip(`q${q}`, 'mv'))); b.append(h, ch);
        const why = [...new Set(mine.flatMap(([, , r]) => r))];
        if (why.length) { const w = document.createElement('div'); w.className = 'why'; w.textContent = `未能排进更早批次：${why.map((r) => REASON[r] || r).join('、')}`; b.append(w); }
      }
      rows.push([c, b]);
    }
  }
  box.replaceChildren(...rows.map(([c, b]) => {
    const r = document.createElement('div'); r.className = `op${focus === c ? ' on' : ''}`;
    const id = document.createElement('div'); id.className = 'id'; id.style.color = COL[c]; id.textContent = c;
    r.append(id, b); r.onclick = () => setFocus(focus === c ? null : c); return r;
  }));
  $('opsMeta').textContent = `本步 ${fmt(realDur[cur] ?? 0)} · 开始于 ${fmt(realCum[cur] ?? 0)}`;
}

// per-stage table
const moveDur = (st) => { let t = 0, i = stageStep[st] + 1; while (i <= last && steps[i].kind === 'move_stage') t += realDur[i++] || 0; return t; };
(function perTable() {
  const t = $('per');
  let h = `<tr><th>Stage</th><th class="l">类型</th>${circuits.map((c) => `<th style="color:${COL[c]}">${c}</th>`).join('')}<th>批次</th><th>移动耗时</th></tr>`;
  for (let st = 0; st < S.stage_count; st++) {
    const k = kindOf(st), ops = S.ops[st] || [];
    const cell = (c) => { const o = ops.find((x) => x.circuit === c); return o ? (o.kind === '1Q' ? `U3×${o.qubits.length}` : `CZ×${o.pairs.length}`) : (S.measuring[st] || []).includes(c) ? '读出' : '·'; };
    h += `<tr data-stage="${st}"><td class="num">${st}</td><td class="l"><span class="kd" style="background:var(${KVAR[k]})"></span>${KNAME[k]}</td>${circuits.map((c) => `<td class="num">${cell(c)}</td>`).join('')}<td class="num">${S.moves[st]?.length ?? 0}</td><td class="num">${fmt(moveDur(st))}</td></tr>`;
  }
  t.innerHTML = h;
  t.onclick = (e) => { const r = e.target.closest('tr[data-stage]'); if (r) { stop(); go(stageStep[+r.dataset.stage], 1); } };
})();

// stage buttons
const stBtns = [];
for (let st = 0; st < S.stage_count; st++) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = st;
  b.style.setProperty('--k', `var(${KVAR[kindOf(st)]})`);
  b.title = `Stage ${st} · ${KNAME[kindOf(st)]}` + (S.ops[st] || []).map((o) => `\n${o.circuit}: ${o.kind === '1Q' ? `U3 × ${o.qubits.length}` : `CZ × ${o.pairs.length}`}`).join('') + (S.moves[st]?.length ? `\n之后 ${S.moves[st].length} 个 AOD 批次` : '');
  b.onclick = () => { stop(); go(stageStep[st], 1); };
  $('st').append(b); stBtns.push(b);
}

// architecture segment
[['five', '五分区'], ['multiq-original', 'Original MultiQ']].forEach(([k, name]) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = name; if (k === ARCH) b.className = 'on';
  b.onclick = () => { if (k !== ARCH) location.href = `${location.pathname}${k === 'five' ? '' : '?architecture=' + k}`; };
  $('arch').append(b);
});

// circuit legend (click to focus)
$('legend').replaceChildren(...circuits.map((c) => {
  const info = (T.batch_circuits || []).find((x) => x.id === c) || {};
  const e = document.createElement('span'); e.className = 'circ'; e.dataset.c = c;
  e.innerHTML = `<span class="dot" style="background:${COL[c]}"></span>${c} · ${info.qubits ?? S.states[0][c].length} qubits${info.peak_ez_pairs != null ? ` · 峰值 CZ ${info.peak_ez_pairs}` : ''}`;
  e.onclick = () => setFocus(focus === c ? null : c); return e;
}));

function setFocus(c) {
  focus = c;
  document.querySelectorAll('.circ').forEach((e) => e.classList.toggle('on', e.dataset.c === c));
  for (const cc of circuits) for (const a of atoms[cc]) a.g.classList.toggle('dimmed', !!c && cc !== c);
  opsPanel(); draw();
}

// ---------------------------------------------------------- transport
const bt = $('bt');
function chrome() {
  const s = steps[cur];
  stBtns.forEach((b, i) => { b.classList.toggle('on', !initial && i === s.stage); b.classList.toggle('past', i < s.stage); });
  const first = stageStep[s.stage], n = (S.moves[s.stage]?.length ?? 0);
  bt.max = Math.max(1, n); bt.value = cur - first; bt.disabled = n === 0;
  const t = (realCum[cur] ?? 0) + (s.kind === 'move_stage' ? (realDur[cur] ?? 0) * tau : 0);
  $('btlab').textContent = initial ? 'Initial mapping'
    : s.kind === 'stage' ? `Stage ${s.stage} · ${KNAME[kindOf(s.stage)]}${n ? ` · 之后 ${n} 个 AOD 批次` : ''}`
    : `AOD 批次 ${s.sub + 1}/${s.count} · ${S.moves[s.stage][s.sub].length} 个原子同时移动`;
  $('live').innerHTML = initial ? 'SZ 中为各电路的初始 tile；EZ 中同色方块为该电路在后续 CZ 层会用到的 pair。'
    : `时间 <b class="num">${fmt(t)}</b> / ${fmt(realTotal)}` + (s.kind === 'move_stage' ? ` · 本批次 ${fmt(realDur[cur] ?? 0)}（2×17 μs 装卸 + 最长路径运动）` : '');
  $('play').textContent = playing ? '⏸ 暂停' : '▶ 播放'; $('play').classList.toggle('on', playing);
  $('initial').classList.toggle('on', initial); $('initial').setAttribute('aria-pressed', String(initial));
  document.querySelectorAll('#per tr[data-stage]').forEach((r) => r.classList.toggle('cur', +r.dataset.stage === s.stage && !initial));
  const row = document.querySelector(`#per tr[data-stage="${s.stage}"]`), wrap = $('perWrap');
  if (row && (row.offsetTop < wrap.scrollTop + 24 || row.offsetTop > wrap.scrollTop + wrap.clientHeight - 24)) wrap.scrollTop = row.offsetTop - wrap.clientHeight / 2;
  ganttCursor(t);
}
const durMs = (i) => (steps[i].kind === 'move_stage' ? 900 : 650) / speeds[sp];
function go(i, t = 1) {
  initial = false;
  cur = Math.max(0, Math.min(last, i)); tau = steps[cur].kind === 'stage' ? 1 : t;
  draw(); opsPanel(); chrome();
  if (!playing && tau < 1) once();
}
const nextIdx = (i, d) => { let j = i + d; if (playing && $('skip').checked) while (j >= 0 && j <= last && steps[j].kind !== 'stage') j += d; return j; };
let lastTs = 0;
function loop(ts) {
  const dt = lastTs ? ts - lastTs : 0; lastTs = ts;
  tau += dt / durMs(cur);
  if (tau >= 1) {
    const j = nextIdx(cur, 1);
    if (j > last) { tau = 1; draw(); stop(); return; }
    cur = j; tau = 0; opsPanel();
  }
  draw(); chrome(); raf = requestAnimationFrame(loop);
}
function play() { if (playing) return; if (initial) initial = false; if (cur >= last) { cur = 0; } playing = true; tau = 0; lastTs = 0; opsPanel(); raf = requestAnimationFrame(loop); chrome(); }
function stop() { playing = false; cancelAnimationFrame(raf); raf = 0; chrome(); }
function once() {
  cancelAnimationFrame(raf); lastTs = 0;
  const run = (ts) => { const dt = lastTs ? ts - lastTs : 0; lastTs = ts; tau = Math.min(1, tau + dt / durMs(cur)); draw(); chrome(); if (tau < 1 && !playing) raf = requestAnimationFrame(run); };
  raf = requestAnimationFrame(run);
}
function replay() {
  stop();
  const s = steps[cur];
  if (s.kind === 'move_stage') return go(cur, 0);
  // on a gate stage: replay every AOD batch that led here, back to back
  const prev = s.stage - 1; if (prev < 0 || !S.moves[prev]?.length) return;
  const from = stageStep[prev] + 1, to = cur;
  cur = from; tau = 0; opsPanel(); lastTs = 0;
  const run = (ts) => {
    const dt = lastTs ? ts - lastTs : 0; lastTs = ts; tau += dt / durMs(cur);
    if (tau >= 1) { if (cur + 1 >= to) return go(to, 1); cur++; tau = 0; opsPanel(); }
    draw(); chrome(); raf = requestAnimationFrame(run);
  };
  raf = requestAnimationFrame(run);
}
const stageJump = (d) => { stop(); const s = steps[cur]; const t = d > 0 ? Math.min(S.stage_count - 1, s.stage + 1) : (s.kind === 'stage' ? Math.max(0, s.stage - 1) : s.stage); go(stageStep[t], 1); };

$('play').onclick = () => (playing ? stop() : play());
$('next').onclick = () => { stop(); go(cur + 1, 0); };
$('prev').onclick = () => { stop(); go(cur - 1, 1); };
$('speed').onclick = (e) => { sp = (sp + 1) % speeds.length; e.currentTarget.textContent = `${speeds[sp]}×`; };
bt.oninput = () => { stop(); go(stageStep[steps[cur].stage] + Number(bt.value), 0); };
$('initial').onclick = () => { stop(); initial = !initial; draw(); chrome(); };
$('allp').onchange = draw; $('aod').onchange = draw;
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input[type=number],select')) return;
  if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); e.shiftKey ? stageJump(1) : (stop(), go(cur + 1, 0)); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? stageJump(-1) : (stop(), go(cur - 1, 1)); }
  else if (e.key === 'Home') { stop(); go(0); } else if (e.key === 'End') { stop(); go(last); }
  else if (e.key === 'r' || e.key === 'R') replay();
});
$('theme').onclick = () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
};

// -------------------------------------------------------------- zoom
let zoom = 1, userZoom = false;
const applyZoom = () => { svg.setAttribute('width', Math.round(S.width * zoom)); svg.setAttribute('height', Math.round(S.height * zoom)); $('zlab').textContent = `${Math.round(zoom * 100)}%`; };
const fit = () => { zoom = Math.max(.05, ($('vp').clientWidth - 2) / S.width); applyZoom(); };
$('zin').onclick = () => { userZoom = true; zoom = Math.min(2, zoom * 1.25); applyZoom(); };
$('zout').onclick = () => { userZoom = true; zoom = Math.max(.05, zoom / 1.25); applyZoom(); };
$('zfit').onclick = () => { userZoom = false; fit(); };
addEventListener('resize', () => { if (!userZoom) fit(); });

// -------------------------------------------------------------- gantt
const G = $('gantt'), GW = 1000, GL = 34, GR = 18, GG = 6, GT = 4;
let cursorLine = null;
if (T.circuit_phases && realTotal) {
  const names = Object.keys(T.circuit_phases), track = GW - GL, H = GT * 2 + names.length * (GR + GG);
  const PC = { compute: '#FF27E6', in_transit: '#397aa0', waiting: '#c9d3ce', readout: '#C72BFF' };
  G.setAttribute('viewBox', `0 0 ${GW} ${H}`);
  names.forEach((c, r) => {
    const y = GT + r * (GR + GG);
    mk('text', { x: 2, y: y + GR / 2 + 4, 'font-size': 12, 'font-weight': 700, fill: COL[c] || 'currentColor' }, G).textContent = c;
    for (const seg of T.circuit_phases[c]) {
      const x0 = GL + seg.start_ns / realTotal * track, x1 = GL + seg.end_ns / realTotal * track;
      mk('rect', { x: x0.toFixed(2), y, width: Math.max(.5, x1 - x0).toFixed(2), height: GR, rx: 3, fill: PC[seg.category] || '#c9d3ce', opacity: seg.category === 'waiting' ? .55 : .9 }, G);
    }
  });
  cursorLine = mk('line', { y1: 0, y2: H, 'stroke-width': 2, style: 'stroke:var(--text)' }, G);
  G.onclick = (e) => {
    const p = G.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const lx = p.matrixTransform(G.getScreenCTM().inverse()).x, target = Math.max(0, Math.min(realTotal, (lx - GL) / track * realTotal));
    let i = 0; while (i + 1 < realCum.length && realCum[i + 1] <= target) i++;
    stop(); go(i, 1);
  };
}
function ganttCursor(t) { if (!cursorLine) return; const x = (GL + t / realTotal * (GW - GL)).toFixed(2); cursorLine.setAttribute('x1', x); cursorLine.setAttribute('x2', x); }

// ------------------------------------------------------ fidelity / cmp
const M = T.performance_model;
if (M) $('metrics').innerHTML = [
  ['公式', '<span class="formula"><i>F</i> = <i>F</i><sub>1Q</sub><sup>N<sub>1Q</sub></sup> · <i>F</i><sub>CZ</sub><sup>N<sub>CZ</sub></sup> · <i>F</i><sub>tr</sub><sup>N<sub>tr</sub></sup> · Π<sub>q</sub> e<sup>−<i>t</i><sub>q</sub>/<i>T</i><sub>2</sub></sup></span>'],
  ['计数', `N<sub>1Q</sub> = ${M.event_counts.u3} · N<sub>CZ</sub> = ${M.event_counts.rydberg_cz} · N<sub>tr</sub> = ${M.event_counts.move}`],
  ['批次联合保真度', `<b>${(M.estimated_success_probability * 100).toFixed(3)}%</b>`],
  ['单电路', Object.entries(M.per_circuit_success_probability).map(([c, v]) => `<span style="color:${COL[c] || 'inherit'}">${c}</span> ${(v * 100).toFixed(2)}%`).join(' · ')],
].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
const tm = window.TIMELINE_METRICS || {}, g = (a, k, f) => (tm[a] ? f(tm[a][k]) : '—');
$('cmp').innerHTML = '<tr><th>指标</th><th>五分区</th><th>Original*</th></tr>' + [
  ['AOD 移动批次', g('five', 'aod_sub_rounds', String), g('original', 'aod_sub_rounds', String)],
  ['Makespan', g('five', 'makespan_us', (v) => `${(v / 1000).toFixed(2)} ms`), g('original', 'makespan_us', (v) => `${(v / 1000).toFixed(2)} ms`)],
  ['联合 Fidelity', g('five', 'batch_fidelity', (v) => `${(v * 100).toFixed(3)}%`), g('original', 'batch_fidelity', (v) => `${(v * 100).toFixed(3)}%`)],
].map((r) => `<tr>${r.map((v, i) => `<td class="${i ? 'num' : ''}">${v}</td>`).join('')}</tr>`).join('');

// ---------------------------------------------------------------- init
fit();
const q = Number(new URLSearchParams(location.search).get('stage'));
go(Number.isFinite(q) && q > 0 ? stageStep[Math.min(S.stage_count - 1, q)] : 0, 1);
})();
</script>
</body>
</html>
