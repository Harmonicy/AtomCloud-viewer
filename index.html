<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中性原子多程序 Stage 查看器</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "PingFang SC", sans-serif; }
    body { margin: 0; background: #f7faf9; color: #21332c; }
    main { max-width: 1280px; margin: 0 auto; padding: 28px 24px 36px; }
    h1 { margin: 0 0 20px; font-size: 24px; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: -8px 0 18px; color: #52645b; font-size: 13px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .legend .c0 { background: #2e9a78; } .legend .c1 { background: #a88918; } .legend .c2 { background: #367ea9; }
    .controls { display: grid; grid-template-columns: 74px auto auto auto auto auto auto minmax(220px, 1fr); gap: 8px; align-items: start; margin-bottom: 18px; }
    label { font-weight: 700; }
    input[type="range"] { width: 100%; accent-color: #397aa0; }
    output { font-variant-numeric: tabular-nums; color: #397aa0; font-weight: 700; white-space: nowrap; font-size: 12px; }
    .playback { width: 28px; height: 28px; padding: 0; border: 1px solid #cbdad3; border-radius: 6px; background: white; color: #397aa0; font-size: 13px; line-height: 1; cursor: pointer; transition: background .12s, color .12s, transform .12s; }
    .playback:active, .playback.is-active { background: #276784; color: white; transform: translateY(1px); }
    #speed { width: 36px; font-size: 11px; }
    .progress-stack { display: grid; min-width: 0; gap: 8px; }
    #stage-label { justify-self: center; text-align: center; }
    .ticks { display: flex; width: 100%; justify-content: space-between; color: #66776f; font-size: 12px; }
    .viewer-panels { display: grid; grid-template-columns: minmax(230px, .9fr) minmax(0, 2.1fr); gap: 16px; align-items: stretch; }
    .left-stack { display: grid; gap: 16px; align-content: start; }
    .panel { min-width: 0; background: white; border: 1px solid #d7e2dd; border-radius: 12px; overflow: hidden; }
    .operations-panel { align-self: stretch; }
    .canvas-toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #e1ebe6; background: #fbfdfc; }
    .canvas-toolbar button { min-width: 30px; border: 1px solid #cbdad3; border-radius: 6px; background: white; color: #397aa0; font-size: 18px; line-height: 28px; cursor: pointer; }
    .canvas-toolbar output { width: 48px; text-align: center; font-size: 13px; }
    .canvas-viewport { height: min(64vh, 680px); min-height: 360px; overflow: auto; background: white; }
    .canvas-stage { position: relative; margin: 0 auto; }
    img { display: block; max-width: none; height: auto; }
    .operation-toggle { margin-right: auto; min-width: auto !important; padding: 0 10px; font-size: 13px !important; }
    #replay-move[hidden] { display: none; }
    .operation-table-wrap { padding: 12px 16px 14px; }
    .operation-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; color: #40554b; font-size: 13px; }
    .operation-table th, .operation-table td { padding: 9px 10px; text-align: left; }
    .operation-table thead th { padding: 0 10px 5px; color: #397aa0; font-size: 12px; }
    .operation-table tbody th { width: 52px; font-weight: 700; border-radius: 7px 0 0 7px; }
    .operation-table tbody td { border-radius: 0 7px 7px 0; line-height: 1.4; }
    .panel-title { margin: 0; padding: 13px 16px 10px; color: #397aa0; font-size: 15px; border-bottom: 1px solid #e1ebe6; }
    .metrics { margin: 0; padding: 10px 16px 14px; color: #40554b; font-size: 12px; line-height: 1.55; }
    .metrics { display: block; }
    .metrics dt { display: inline; color: #397aa0; font-weight: 700; }
    .metrics dt::after { content: '：'; }
    .metrics dd { display: inline; margin: 0; }
    .metrics dd::after { content: ''; display: block; height: 8px; }
    .fidelity-formula { display: inline; color: #2b5d7f; font-family: Georgia, "Times New Roman", serif; font-size: 15px; white-space: nowrap; }
    .fidelity-formula i { font-weight: 700; } .fidelity-formula sup, .fidelity-formula sub { font-size: .7em; line-height: 0; }
    .fidelity-parameters { color: #40554b; font-family: Georgia, "Times New Roman", serif; line-height: 1.75; }
    .fidelity-parameters i { font-weight: 700; } .fidelity-parameters sup, .fidelity-parameters sub { font-size: .72em; line-height: 0; }
    @media (max-width: 760px) {
      main { padding: 18px 12px; }
      .controls { grid-template-columns: 1fr; gap: 8px; }
      .progress-stack { width: 100%; }
      .viewer-panels { grid-template-columns: 1fr; }
      .canvas-viewport { height: min(62vh, 580px); }
    }
  </style>
</head>
<body>
  <main>
    <h1>中性原子多程序并行执行</h1>
    <div class="legend" aria-label="MultiQ 电路 tile 图例">
      <span><i class="c0"></i>C0 · 4 qubits · 2 EZ pairs</span>
      <span><i class="c1"></i>C1 · 8 qubits · 4 EZ pairs</span>
      <span><i class="c2"></i>C2 · 16 qubits · 8 EZ pairs</span>
    </div>
    <div class="controls">
      <label for="stage">执行进度</label>
      <button id="play" class="playback" type="button" aria-label="播放">▶</button>
      <button id="pause" class="playback" type="button" aria-label="暂停">❚❚</button>
      <button id="reset" class="playback" type="button" aria-label="重置">↺</button>
      <button id="previous" class="playback" type="button" aria-label="前一帧">⏪</button>
      <button id="next" class="playback" type="button" aria-label="后一帧">⏩</button>
      <button id="speed" class="playback" type="button" aria-label="切换播放速度">1×</button>
      <div class="progress-stack">
        <input id="stage" type="range" min="0" max="0" value="0" step="1" aria-keyshortcuts="ArrowLeft ArrowRight">
        <output id="stage-label" for="stage" aria-live="polite">Stage 0 · 0–2 s</output>
        <div id="ticks" class="ticks" aria-hidden="true"></div>
      </div>
    </div>
    <div class="viewer-panels">
      <div class="left-stack">
      <section class="panel operations-panel" aria-label="当前电路操作">
        <h2 class="panel-title">Detail</h2>
        <div class="operation-table-wrap"><table class="operation-table"><thead><tr><th>电路</th><th>当前操作</th></tr></thead><tbody id="operation-rows"></tbody></table></div>
      </section>
      <section class="panel" aria-label="Fidelity">
        <h2 class="panel-title">Fidelity</h2>
        <dl id="metrics" class="metrics"></dl>
      </section>
      </div>
      <section class="panel canvas-panel" aria-label="原子阵列可视化">
        <div class="canvas-toolbar" aria-label="画布缩放">
          <button id="operation-toggle" class="operation-toggle" type="button" aria-pressed="true">返回执行态</button>
          <button id="replay-move" class="operation-toggle" type="button" hidden>重放移动</button>
          <button id="zoom-out" type="button" aria-label="缩小画布">−</button>
          <output id="zoom-label">100%</output>
          <button id="zoom-reset" type="button" aria-label="适配完整画布">适配</button>
          <button id="zoom-in" type="button" aria-label="放大画布">+</button>
        </div>
        <div id="canvas-viewport" class="canvas-viewport">
          <div id="canvas-stage" class="canvas-stage"><img id="frame" src="_readout_frames/initial_mapping.svg" decoding="async" alt="Initial mapping：三个电路的初始 tile 映射。"></div>
        </div>
      </section>
      </div>
  </main>
  <script src="stage_timing.js"></script>
  <script>
    const slider = document.getElementById('stage');
    const frame = document.getElementById('frame');
    const label = document.getElementById('stage-label');
    const operationRows = document.getElementById('operation-rows');
    const metrics = document.getElementById('metrics');
    const ticks = document.getElementById('ticks');
    const canvasViewport = document.getElementById('canvas-viewport');
    const canvasStage = document.getElementById('canvas-stage');
    const zoomLabel = document.getElementById('zoom-label');
    const timing = window.STAGE_TIMING;
    let playbackTimer = null;
    const speedModes = [
      { label: '.8×', factor: 1.18 }, { label: '1×', factor: 1 }, { label: '1.2×', factor: .84 },
      { label: '1.4×', factor: .72 }, { label: '1.6×', factor: .63 },
    ];
    let speedIndex = 1;
    const gateStages = timing.gate_stage_count;
    const timeline = timing.viewer_timeline;
    const lastStage = timing.durations_ns.length - 1;
    const lastStep = timeline.length - 1;
    slider.max = lastStep;
    // Decode every small static frame once at startup.  Slider input then only
    // swaps an already-cached bitmap instead of triggering network/disk work.
    const frames = timeline.map((item) => {
      const image = new Image();
      image.src = `_readout_frames/${item.frame}`;
      image.decode?.().catch(() => {});
      return image;
    });
    const initialFrame = new Image();
    initialFrame.src = '_readout_frames/initial_mapping.svg';
    let requestedFrame = 0;
    let activeStep = 0;
    // The static placement is the entry view; progress interaction switches
    // naturally to the execution timeline.
    let showOperations = false;
    // Do not blank the canvas while a requested SVG is still being fetched.
    // This matters especially on Pages, where the 34 frames arrive separately.
    const showFrameWhenReady = (step) => {
      const request = ++requestedFrame;
      const next = showOperations ? frames[step] : initialFrame;
      const swap = () => {
        if (requestedFrame !== request) return;
        // A fresh URL fragment makes each entry into a move stage restart its
        // one-shot SVG animation, even when its frame is already cached.
        const isMove = timeline[step].kind === 'move_stage' && showOperations;
        frame.src = isMove ? `${next.src}${next.src.includes('?') ? '&' : '?'}play=${Date.now()}` : next.src;
      };
      if (next.complete && next.naturalWidth) {
        swap();
      } else {
        next.addEventListener('load', swap, { once: true });
      }
    };
    let zoom = 1;
    let baseWidth = 0;
    let baseHeight = 0;
    let userZoomed = false;
    const applyZoom = () => {
      canvasStage.style.width = `${baseWidth * zoom}px`;
      canvasStage.style.height = `${baseHeight * zoom}px`;
      // Set the SVG's real display size instead of transforming a full-size
      // image.  This keeps overflow measurement and visible size identical.
      frame.style.width = `${baseWidth * zoom}px`;
      frame.style.height = `${baseHeight * zoom}px`;
      frame.style.transform = 'none';
      zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
    };
    const initializeCanvas = () => {
      if (!baseWidth) {
        baseWidth = frame.naturalWidth;
        baseHeight = frame.naturalHeight;
        fitCanvas();
      }
    };
    // Start with the complete SVG visible inside its own viewport.  The image
    // remains vector-based, so manual zooming afterward stays sharp.
    const fitCanvas = () => {
      if (!baseWidth || !baseHeight) return;
      const availableWidth = Math.max(1, canvasViewport.clientWidth - 2);
      const availableHeight = Math.max(1, canvasViewport.clientHeight - 2);
      zoom = Math.min(1, availableWidth / baseWidth, availableHeight / baseHeight);
      applyZoom();
    };
    frame.addEventListener('load', initializeCanvas);
    if (frame.complete && frame.naturalWidth) initializeCanvas();
    document.getElementById('zoom-in').addEventListener('click', () => { userZoomed = true; zoom = Math.min(2.5, zoom + 0.2); applyZoom(); });
    document.getElementById('zoom-out').addEventListener('click', () => { userZoomed = true; zoom = Math.max(0.1, zoom - 0.2); applyZoom(); });
    document.getElementById('zoom-reset').addEventListener('click', () => { userZoomed = false; fitCanvas(); });
    window.addEventListener('resize', () => { if (!userZoomed) fitCanvas(); });
    document.getElementById('operation-toggle').addEventListener('click', (event) => {
      showOperations = !showOperations;
      event.currentTarget.textContent = showOperations ? 'Initial mapping' : '返回执行态';
      event.currentTarget.setAttribute('aria-pressed', String(!showOperations));
      update();
    });
    const stepForStage = (stage) => timeline.findIndex((item) => item.kind === 'stage' && item.stage === stage);
    ticks.replaceChildren(...[0, ...Object.values(timing.circuit_end_stage).map(stepForStage), stepForStage(gateStages - 1), lastStep]
      .filter((value, index, values) => values.indexOf(value) === index)
      .sort((a, b) => a - b)
      .map((value) => { const node = document.createElement('span'); const item = timeline[value]; node.textContent = value === lastStep ? 'Readout end' : `Stage ${item.stage}`; return node; }));
    const formatTime = (ns) => ns >= 1e6 ? `${(ns / 1e6).toFixed(3)} ms` : ns >= 1e3 ? `${(ns / 1e3).toFixed(3)} μs` : `${ns.toFixed(1)} ns`;
    const descriptions = (stage) => {
      const activeReadout = [];
      for (const [circuit, endStage] of Object.entries(timing.circuit_end_stage)) {
        if (stage >= endStage && stage < endStage + 5) activeReadout.push(`${circuit} 正在 ${timing.circuit_readout_zone[circuit]} 测量`);
      }
      const phase = stage < gateStages ? `Stage ${stage}` : '完成后读出';
      const startNs = timing.durations_ns.slice(0, stage).reduce((sum, value) => sum + value, 0);
      const endNs = startNs + timing.durations_ns[stage];
      return { startNs, endNs, phase, text: activeReadout.length ? activeReadout.join('；') : '执行 MultiQ 调度的门操作' };
    };
    const update = () => {
      const step = Number(slider.value);
      activeStep = step;
      const timelineItem = timeline[step];
      const stage = timelineItem.stage;
      const info = descriptions(stage);
      showFrameWhenReady(step);
      frame.alt = `${timelineItem.kind === 'move_stage' ? `move_stage ${stage}` : info.phase}：${info.text}。`;
      label.textContent = !showOperations ? 'Initial mapping · 初始 tile 分配'
        : timelineItem.kind === 'move_stage'
        ? `move_stage ${stage}.${timelineItem.substage} · 跟随 Stage ${stage}（${timelineItem.moves} 个兼容移动）`
        : `${info.phase} · ${formatTime(info.startNs)}–${formatTime(info.endNs)}`;
      document.getElementById('replay-move').hidden = !showOperations || timelineItem.kind !== 'move_stage';
      const tileColours = { C0: '#DDF2E7', C1: '#F7EFC8', C2: '#DCECF7' };
      const initialMapping = { C0: '初始映射：4 个 qubit 位于 SZ0', C1: '初始映射：8 个 qubit 位于 SZ0', C2: '初始映射：16 个 qubit 位于 SZ1' };
      const stageOperations = timing.stage_operations[stage] || {};
      operationRows.replaceChildren(...['C0', 'C1', 'C2'].map((circuit) => {
        const row = document.createElement('tr');
        const name = document.createElement('th');
        const operation = document.createElement('td');
        name.scope = 'row'; name.textContent = circuit;
        let description = !showOperations ? initialMapping[circuit] : stageOperations[circuit] || '空闲';
        if (showOperations && timelineItem.kind === 'move_stage' && stage < timing.circuit_end_stage[circuit]) {
          const count = timelineItem.circuit_moves?.[circuit] || 0;
          description = count ? `${count} 个 qubit 正在移动` : '等待其他电路移动';
        }
        operation.textContent = description;
        name.style.backgroundColor = tileColours[circuit];
        operation.style.backgroundColor = tileColours[circuit];
        row.append(name, operation);
        return row;
      }));
      const model = timing.performance_model;
      const formula = document.createElement('span');
      formula.className = 'fidelity-formula';
      formula.innerHTML = '<i>F</i><sub>batch</sub> = (<i>F</i><sub>1Q</sub>)<sup>N<sub>1Q</sub></sup> × (<i>F</i><sub>CZ</sub>)<sup>N<sub>CZ</sub></sup> × (<i>F</i><sub>transfer</sub>)<sup>N<sub>transfer</sub></sup>';
      const parameters = document.createElement('span');
      parameters.className = 'fidelity-parameters';
      parameters.innerHTML = `<i>F</i><sub>1Q</sub> = 0.9991, <i>N</i><sub>1Q</sub> = ${model.event_counts.u3}<br><i>F</i><sub>CZ</sub> = 0.995, <i>N</i><sub>CZ</sub> = ${model.event_counts.rydberg_cz}<br><i>F</i><sub>transfer</sub> = 0.999, <i>N</i><sub>transfer</sub> = ${model.event_counts.move}`;
      const entries = [
        ['公式', formula],
        ['参数', parameters],
        ['批次联合保真度', `${(model.estimated_success_probability * 100).toFixed(3)}%`],
        ['单电路保真度', `C0 ${(model.per_circuit_success_probability.C0 * 100).toFixed(2)}% · C1 ${(model.per_circuit_success_probability.C1 * 100).toFixed(2)}% · C2 ${(model.per_circuit_success_probability.C2 * 100).toFixed(2)}%`],
      ];
      metrics.replaceChildren(...entries.flatMap(([key, value]) => { const dt=document.createElement('dt'); dt.textContent=key; const dd=document.createElement('dd'); typeof value === 'string' ? dd.textContent=value : dd.append(value); return [dt, dd]; }));
    };
    document.getElementById('replay-move').addEventListener('click', () => {
      const source = frames[activeStep].src;
      frame.src = '';
      requestAnimationFrame(() => { frame.src = `${source}${source.includes('?') ? '&' : '?'}replay=${Date.now()}`; });
    });
    const flashButton = (button) => { button.classList.add('is-active'); setTimeout(() => button.classList.remove('is-active'), 140); };
    const stopPlayback = () => { if (playbackTimer) clearTimeout(playbackTimer); playbackTimer = null; };
    const playNext = () => {
      if (Number(slider.value) >= lastStep) return stopPlayback();
      slider.value = Number(slider.value) + 1;
      update();
      playbackTimer = setTimeout(playNext, (timeline[Number(slider.value)].kind === 'move_stage' ? 2100 : 1800) * speedModes[speedIndex].factor);
    };
    const enterExecution = () => {
      if (!showOperations) {
        showOperations = true;
        const toggle = document.getElementById('operation-toggle');
        toggle.textContent = 'Initial mapping';
        toggle.setAttribute('aria-pressed', 'false');
      }
    };
    document.getElementById('play').addEventListener('click', (event) => { flashButton(event.currentTarget); enterExecution(); update(); if (!playbackTimer) playNext(); });
    document.getElementById('pause').addEventListener('click', (event) => { flashButton(event.currentTarget); stopPlayback(); });
    document.getElementById('reset').addEventListener('click', (event) => { flashButton(event.currentTarget); stopPlayback(); slider.value = 0; update(); });
    const stepBy = (delta, button) => {
      flashButton(button);
      stopPlayback();
      enterExecution();
      slider.value = Math.max(0, Math.min(lastStep, Number(slider.value) + delta));
      update();
    };
    document.getElementById('previous').addEventListener('click', (event) => stepBy(-1, event.currentTarget));
    document.getElementById('next').addEventListener('click', (event) => stepBy(1, event.currentTarget));
    document.getElementById('speed').addEventListener('click', (event) => { speedIndex = (speedIndex + 1) % speedModes.length; event.currentTarget.textContent = speedModes[speedIndex].label; flashButton(event.currentTarget); });
    slider.addEventListener('input', () => { enterExecution(); update(); });
    slider.addEventListener('keydown', (event) => {
      const delta = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
      if (!delta) return;
      event.preventDefault();
      slider.value = Math.max(0, Math.min(lastStep, Number(slider.value) + delta));
      enterExecution();
      update();
    });
    update();
  </script>
</body>
</html>
